name: mobile_banking_app
description: Aplicación de banca móvil con patrones de diseño GoF
version: 1.0.0+1
environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  dio: ^5.7.0
  get_it: ^8.0.3
  equatable: ^2.0.7
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/